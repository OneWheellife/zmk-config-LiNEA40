name: Codex Debug Build

on:
  push:
    branches:
      - codex/debug-ci
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xiao_ble
            shield: LiNEA40_left rgbled_adapter
            extra_west_args: ""
            extra_cmake_args: ""
          - board: xiao_ble
            shield: LiNEA40_right rgbled_adapter
            extra_west_args: "-S studio-rpc-usb-uart"
            extra_cmake_args: "-DCONFIG_ZMK_STUDIO=y"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare west workspace
        shell: bash
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build and print failing tail
        shell: bash
        run: |
          set +e
          west build -s zmk/app -d build -b "${{ matrix.board }}" ${{ matrix.extra_west_args }} -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
            -DSHIELD="${{ matrix.shield }}" \
            ${{ matrix.extra_cmake_args }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== last 240 build lines ====="
            tail -n 240 build.log
          fi
          exit "$status"
